name: Myntra Weekly Order Bot

on:
  schedule:
    # Runs at 06:30 UTC every Mon, Wed, Fri (which is 12:00 PM IST)
    - cron: '30 6 * * 1,3,5'
  workflow_dispatch: # Allows manual run button in GitHub Actions tab

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Write session cookies
        env:
          MYNTRA_COOKIES_JSON: ${{ secrets.MYNTRA_COOKIES_JSON }}
        run: |
          printf '%s' "$MYNTRA_COOKIES_JSON" > myntra_cookies.json

      - name: Execute Myntra Order Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp &
          export DISPLAY=:99
          for i in $(seq 1 20); do
            [ -e /tmp/.X11-unix/X99 ] && break
            sleep 0.5
          done
          python myntra_weekly_order.py

      - name: Commit & Push Updated Purchased History
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add purchased_history.json
          git status
          git diff-index --quiet HEAD || git commit -m "chore: update purchased_history.json [skip ci]"
          git push